name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds the library, all examples, and `AsyncLean/Audit.lean`, whose
      # `#assert_standard_axioms` commands fail the build if any result depends on
      # `sorry`, `native_decide` or a user-declared axiom.
      - uses: leanprover/lean-action@v1
