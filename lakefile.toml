name = "AsyncLean"
version = "0.2.0"
defaultTargets = ["AsyncLean"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "AsyncLean"

# The design files read by the importers (`stg_from_g`, `pnet_from_pnml`, `*_from_verilog`).
[[input_dir]]
name = "designs"
path = "AsyncLean/Examples/designs"
text = true

# Modules that import design files live in a library that depends on them, so that editing a
# design file rebuilds exactly these modules.
[[lean_lib]]
name = "AsyncLeanDesigns"
roots = ["AsyncLean.Examples.Imported", "AsyncLean.Examples.RTL"]
needs = ["@/designs"]
